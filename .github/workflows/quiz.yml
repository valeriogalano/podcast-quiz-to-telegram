name: Daily Quiz

on:
  schedule:
    - cron: "0 10,15 * * *"
  workflow_dispatch:

# The job only reads the code: the token needs no write access.
permissions:
  contents: read

# A manual run started to make up for a late scheduled one must not overlap it:
# two quizzes would go out minutes apart. The second run waits instead.
concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # without it a stuck provider or feed keeps the job up to the 6-hour limit (run #538)
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quiz bot
        env:
          # stdout is block-buffered when not a terminal: without this its lines
          # reach the log only at the end, out of order with stderr, and are lost
          # if the job is cancelled
          PYTHONUNBUFFERED: "1"
          FEED_RSS_URL: ${{ vars.FEED_RSS_URL }}
          GH_REPO: ${{ vars.GH_REPO }}
          GH_SCRIPTS_PATH: ${{ vars.GH_SCRIPTS_PATH }}
          SCRIPT_EXTENSION: ${{ vars.SCRIPT_EXTENSION }}
          QUIZ_PROVIDER: ${{ vars.QUIZ_PROVIDER }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python quiz_bot.py
