name: Daily Quiz

on:
  schedule:
    - cron: "17 10,15 * * *"
  workflow_dispatch:

# The job only reads the code: the token needs no write access.
permissions:
  contents: read

# A manual run started to make up for a late scheduled one must not overlap it:
# two quizzes would go out minutes apart. The second run waits instead.
concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  keepalive:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1

  publish:
    runs-on: ubuntu-latest
    # without it a stuck provider or feed keeps the job up to the 6-hour limit (run #538)
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quiz bot
        env:
          # stdout is block-buffered when not a terminal: without this its lines
          # reach the log only at the end, out of order with stderr, and are lost
          # if the job is cancelled
          PYTHONUNBUFFERED: "1"
          FEED_RSS_URL: ${{ vars.FEED_RSS_URL }}
          GH_REPO: ${{ vars.GH_REPO }}
          GH_SCRIPTS_PATH: ${{ vars.GH_SCRIPTS_PATH }}
          SCRIPT_EXTENSION: ${{ vars.SCRIPT_EXTENSION }}
          QUIZ_PROVIDER: ${{ vars.QUIZ_PROVIDER }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python quiz_bot.py

  notify-failure:
    needs: [publish, keepalive]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify private chat
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          if [[ ! "$ADMIN_CHAT_ID" =~ ^-?[1-9][0-9]*$ ]] || [[ -z "$BOT_TOKEN" ]]; then
            echo "Notification chat ID or bot token is missing or invalid" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --data-urlencode "chat_id=$ADMIN_CHAT_ID" \
            --data-urlencode "text=Workflow failed: $REPOSITORY / $WORKFLOW
          $RUN_URL" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" |
            python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("ok") is True else 1)'
