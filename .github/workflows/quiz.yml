name: Daily Quiz

on:
  schedule:
    - cron: "0 10,15 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quiz bot
        env:
          # stdout is block-buffered when not a terminal: without this its lines
          # reach the log only at the end, out of order with stderr, and are lost
          # if the job is cancelled
          PYTHONUNBUFFERED: "1"
          FEED_RSS_URL: ${{ vars.FEED_RSS_URL }}
          GH_REPO: ${{ vars.GH_REPO }}
          GH_SCRIPTS_PATH: ${{ vars.GH_SCRIPTS_PATH }}
          SCRIPT_EXTENSION: ${{ vars.SCRIPT_EXTENSION }}
          QUIZ_PROVIDER: ${{ vars.QUIZ_PROVIDER }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python quiz_bot.py
